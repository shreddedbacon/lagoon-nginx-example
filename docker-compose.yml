version: '2'
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      lagoon.type: nginx
      lagoon.volumes.extravol.path: /extra
    volumes:
      - ./app:/app:delegated
    ports:
      - "8080:8080"
