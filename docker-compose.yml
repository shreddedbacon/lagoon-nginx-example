version: '2'
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      lagoon.type: nginx
    volumes:
      - ./app:/app:delegated
    ports:
      - "8080:8080"
  database:
    image: uselagoon/mariadb-10.6-drupal:latest
    labels:
      lagoon.type: mariadb
  database2:
    image: uselagoon/mariadb-10.6-drupal:latest
    labels:
      lagoon.type: mariadb
  database3:
    image: uselagoon/mariadb-10.6-drupal:latest
    labels:
      lagoon.type: mariadb
